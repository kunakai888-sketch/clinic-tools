name: Fix specialist dashboard HTML

on:
  push:
    paths:
      - '.github/workflows/fix-senmoni.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore verified plain HTML
        run: |
          python - <<'PY'
          import base64, gzip
          from pathlib import Path
          payload = ''''''
          html = gzip.decompress(base64.b64decode(payload)).decode('utf-8')
          Path('senmoni-dashboard.html').write_text(html, encoding='utf-8')
          print('Restored verified HTML:', len(html), 'chars')
          PY
      - name: Commit restored dashboard
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add senmoni-dashboard.html
          git commit -m 'Restore dashboard as plain HTML with save button'
          git push
