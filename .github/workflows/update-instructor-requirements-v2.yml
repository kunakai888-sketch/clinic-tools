name: Apply instructor requirements v2

on:
  push:
    paths:
      - '.github/workflows/update-instructor-requirements-v2.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch dashboard
        run: echo '' | base64 -d | python
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add senmoni-dashboard.html
          git commit -m 'Use instructor renewal requirements for nephrology and dialysis'
          git push
