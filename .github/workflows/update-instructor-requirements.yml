name: Update instructor requirements

on:
  push:
    paths:
      - '.github/workflows/update-instructor-requirements.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch dashboard requirements
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('senmoni-dashboard.html')
          s = p.read_text(encoding='utf-8')
          jsn = '''    {
      id: "jsn", color: "--q-jsn",
      name: "腎臓指導医",
      society: "日本腎臓学会",
      cycleYears: 5,
      requiredTotal: 50,
      renewalDate: "",
      feePaidDate: "",
      fields: [
        { id: "jsnown", label: "腎臓専門医維持：腎臓学会企画の単位 (25以上必須)", min: 25, value: 0 },
        { id: "other", label: "腎臓専門医維持：その他 (関連学会・論文など)", min: 0, value: 0 }
      ],
      musts: [
        { id: "m1", label: "腎臓専門医資格を維持（5年間50単位、うち腎臓学会企画25単位以上）", done: false },
        { id: "m2", label: "学術総会 または 東部・西部学術大会に5年間で1回以上出席（専門医更新要件）", done: false },
        { id: "m3", label: "5年に1回以上、厚労省・基本領域学会・日本腎臓学会主催の指導医講習会を修了", done: false },
        { id: "m4", label: "腎臓指導医として十分な指導経験を有する", done: false },
        { id: "m5", label: "選択要件：司会・座長・発表等の主導的関与 または 日本腎臓学会での教育活動を満たす", done: false }
      ],
      window: "指導医は5年ごとに更新。更新対象者には前年12月頃に申請書類が郵送され、審査後4/1付で更新。",
      creditGuide: [
        "専門医維持：5年間50単位（うち日本腎臓学会企画25単位以上）",
        "学術総会 参加: 10単位 (+教育講演受講5単位 = 計15単位)",
        "東部・西部学術大会 参加: 6単位 (+教育講演4単位 = 計10単位)",
        "セルフトレーニング問題: 5単位 / 基本領域学会年次集会: 5単位 / 関連学会年次集会: 4単位"
      ],
      note: "指導医更新そのものは単位制ではなく、専門医資格維持＋指導医講習会＋指導経験＋選択要件が中心。画面の50単位欄は、指導医の前提となる腎臓専門医資格を維持するための単位を管理するもの。",
      sources: [["指導医更新要件Q&A(腎臓学会)", "https://cdn.jsn.or.jp/medic/specialistsystem/j-osler/faq.php"], ["腎臓専門医資格更新 所定単位表", "https://cdn.jsn.or.jp/data/tanihyo-2024.pdf"], ["専門医制度(腎臓学会)", "https://jsn.or.jp/medic/specialistsystem/specialist/"]]
    },
'''
          jsdt = '''    {
      id: "jsdt", color: "--q-jsdt",
      name: "透析指導医",
      society: "日本透析医学会",
      cycleYears: 5,
      requiredTotal: 50,
      renewalDate: "",
      feePaidDate: "",
      fields: [
        { id: "total", label: "指導医更新：取得単位 合計", min: 50, value: 0 }
      ],
      musts: [
        { id: "m1", label: "透析専門医として登録されている", done: false },
        { id: "m2", label: "認定期間5年間で年次学術集会に2回以上参加", done: false },
        { id: "m3", label: "認定期間5年間でセルフトレーニング問題に1回以上正答", done: false },
        { id: "m4", label: "認定期間5年間のうち通算3年以上、主として透析療法に従事", done: false }
      ],
      window: "指導医認定証の有効期限満了日の前1年以内に更新申請。",
      creditGuide: [
        "指導医更新：認定期間5年間で50単位",
        "年次学術集会 参加: 10単位 (筆頭発表+20 / 共同+5)",
        "年次学術集会 教育講演(卒後生涯教育プログラム): 5単位",
        "日本腎臓学会総会: 5単位 / 日本医学会総会: 10単位 / 国際学会: 5単位",
        "日本腹膜透析医学会学術集会など委員会承認の全国規模学術集会: 3単位"
      ],
      note: "日本透析医学会の指導医更新は、専門医としての登録、5年間50単位、年次学術集会2回以上、セルフトレーニング1回以上正答、通算3年以上の透析療法従事が要件。勤務日数の換算規定あり。",
      sources: [["専門医制度に関する申請要項(透析医学会)", "https://www.jsdt.or.jp/specialist/2112.html"], ["専門医制度規則・施行細則", "https://www.jsdt.or.jp/specialist/"]]
    },
'''
          s, n1 = re.subn(r'    \{\n      id: "jsn"[\s\S]*?\n    \},\n(?=    \{\n      id: "jsdt")', jsn, s, count=1)
          s, n2 = re.subn(r'    \{\n      id: "jsdt"[\s\S]*?\n    \},\n(?=    \{\n      id: "jsh")', jsdt, s, count=1)
          if (n1, n2) != (1, 1):
              raise SystemExit(f'patch failed: jsn={n1}, jsdt={n2}')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add senmoni-dashboard.html
          git commit -m 'Use instructor renewal requirements for nephrology and dialysis'
          git push
